name: Build e deploy backend

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/wiktorverga/autopost_backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy su Azure via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: autopost
          key: ${{ secrets.AZURE_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/autopost
            git fetch origin
            git reset --hard origin/master
            cd deploy
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull backend
            docker compose up -d
            docker image prune -f
