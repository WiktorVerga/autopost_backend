services:
  backend:
    image: ghcr.io/wiktorverga/autopost_backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Rome
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2500m        # se il rendering esagera, viene fermato il backend, non il database

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: autopost
      POSTGRES_DB: autopost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # solo in locale: ci arrivi dal PC con il tunnel SSH
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopost"]
      interval: 10s
      retries: 5
    mem_limit: 512m

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # i certificati: non perderli
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config: