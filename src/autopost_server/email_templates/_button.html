{# Bottone primario: inchiostro su carta, raggio 6px come --radius. Si aspetta button_href e button_label. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 4px 0;">
  <tr>
    <td style="border-radius:6px; background-color:#1D1713;">
      <a href="{{ button_href }}" style="display:inline-block; padding:13px 22px; font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:15px; font-weight:600; line-height:1; color:#FCF9F5; text-decoration:none; border-radius:6px;">{{ button_label }}&nbsp;&rarr;</a>
    </td>
  </tr>
</table>
